[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "work-assistant-agent-backend"
version = "0.1.0"
description = "Neutral FastAPI host for the Work Assistant Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<1.19",
  "fastapi>=0.139,<0.140",
  "greenlet>=3.2,<4",
  "langchain>=1.3,<1.4",
  "langchain-deepseek>=1.1,<1.2",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "python-dotenv>=1.2,<2",
  "sqlalchemy>=2.0,<2.1",
  "tzdata>=2025.3",
  "uvicorn[standard]>=0.40,<0.41",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22,<0.23",
  "httpx>=0.28,<0.29",
  "mypy>=1.19,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.15,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/work_assistant"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["work_assistant"]

[[tool.mypy.overrides]]
module = ["langgraph.checkpoint.postgres.*"]
ignore_missing_imports = true
