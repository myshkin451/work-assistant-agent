[project]
name = "neutral-mcp-server-fixture"
version = "0.1.0"
description = "Controlled, deterministic stdio MCP fixture for adapter contract tests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==2.0.0",
]

[project.scripts]
neutral-mcp-server = "neutral_mcp_server.server:main"

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.12",
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neutral_mcp_server"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
